# Copy to artifact-storage.yaml (gitignored) and edit.
# Single file switches local dir vs S3-compatible cloud (OSS/OBS/COS/S3/MinIO) without changing pipeline commands.

# 示例：表 dsp_test4 构建产物目录常为 /data/yikv_data/dsp_test4（见 README「示例」）。

provider: local
env: dev
key_prefix: yikv-index

local:
  root: /data/yikv-artifact-store

